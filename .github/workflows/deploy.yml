name: Deploy with Secure Config

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Add permissions at the top level
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Add permissions for this job
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create config directory
        run: mkdir -p config
      
      - name: Generate production config
        run: |
          echo "// ============================================================" > config/config.prod.js
          echo "// PRODUCTION CONFIG - Auto-generated by GitHub Actions" >> config/config.prod.js
          echo "// ============================================================" >> config/config.prod.js
          echo "" >> config/config.prod.js
          echo "const CONFIG = {" >> config/config.prod.js
          echo "    SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> config/config.prod.js
          echo "    SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'," >> config/config.prod.js
          echo "    APP_NAME: 'NTWC_MPU_DRWS'," >> config/config.prod.js
          echo "    APP_VERSION: '2.0'," >> config/config.prod.js
          echo "    APP_ENV: 'production'," >> config/config.prod.js
          echo "    ENABLE_DEBUG: false" >> config/config.prod.js
          echo "};" >> config/config.prod.js
          echo "" >> config/config.prod.js
          echo "if (typeof window !== 'undefined') {" >> config/config.prod.js
          echo "    window.__CONFIG__ = CONFIG;" >> config/config.prod.js
          echo "}" >> config/config.prod.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          user_name: 'Sholowai88'
          user_email: 'ntwc.william@gmail.com'  # ← CHANGE THIS to your email
          commit_message: 'Deploy with secure configuration'
          force_orphan: true
