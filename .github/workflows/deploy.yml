# .github/workflows/deploy.yml
name: Deploy with Secure Config

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout your code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Create config directory
      - name: Create config directory
        run: mkdir -p config
      
      # Step 3: Generate config file from secrets
      - name: Generate production config
        run: |
          echo "// ============================================================" > config/config.prod.js
          echo "// PRODUCTION CONFIG - Auto-generated by GitHub Actions" >> config/config.prod.js
          echo "// ============================================================" >> config/config.prod.js
          echo "" >> config/config.prod.js
          echo "const CONFIG = {" >> config/config.prod.js
          echo "    SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> config/config.prod.js
          echo "    SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'," >> config/config.prod.js
          echo "    APP_NAME: 'NTWC_MPU_DRWS'," >> config/config.prod.js
          echo "    APP_VERSION: '2.0'," >> config/config.prod.js
          echo "    APP_ENV: 'production'," >> config/config.prod.js
          echo "    ENABLE_DEBUG: false" >> config/config.prod.js
          echo "};" >> config/config.prod.js
          echo "" >> config/config.prod.js
          echo "// Make it available globally" >> config/config.prod.js
          echo "if (typeof window !== 'undefined') {" >> config/config.prod.js
          echo "    window.__CONFIG__ = CONFIG;" >> config/config.prod.js
          echo "}" >> config/config.prod.js
          echo "" >> config/config.prod.js
          echo "// Export for Node.js" >> config/config.prod.js
          echo "if (typeof module !== 'undefined' && module.exports) {" >> config/config.prod.js
          echo "    module.exports = CONFIG;" >> config/config.prod.js
          echo "}" >> config/config.prod.js
      
      # Step 4: Verify config was created
      - name: Verify config file
        run: |
          echo "📄 Config file created:"
          head -20 config/config.prod.js
      
      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy with secure configuration'
      
      # Step 6: Show deployment URL
      - name: Show deployment URL
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Your site will be available at:"
          echo "   https://${{ github.repository_owner }}.github.io/william-equip-info/"
