name: Deploy with Secure Config

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create production config from secrets
        run: |
          echo "// ============================================================" > config.prod.js
          echo "// PRODUCTION CONFIG - Auto-generated by GitHub Actions" >> config.prod.js
          echo "// ============================================================" >> config.prod.js
          echo "" >> config.prod.js
          echo "const CONFIG = {" >> config.prod.js
          echo "    SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> config.prod.js
          echo "    SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'," >> config.prod.js
          echo "    APP_NAME: 'NTWC_MPU_DRWS'," >> config.prod.js
          echo "    APP_VERSION: '2.0'," >> config.prod.js
          echo "    APP_ENV: 'production'," >> config.prod.js
          echo "    ENABLE_DEBUG: false" >> config.prod.js
          echo "};" >> config.prod.js
          echo "" >> config.prod.js
          echo "if (typeof window !== 'undefined') {" >> config.prod.js
          echo "    window.__CONFIG__ = CONFIG;" >> config.prod.js
          echo "}" >> config.prod.js
          
          echo "📄 Production config created successfully"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy with secure configuration'
          force_orphan: true
