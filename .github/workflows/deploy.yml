# .github/workflows/deploy.yml
name: Deploy with Secure Config

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Permissions needed for deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      # Step 1: Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Create the config file from GitHub Secrets
      - name: Generate production config
        run: |
          echo "// ============================================================" > config.prod.js
          echo "// PRODUCTION CONFIG - Auto-generated by GitHub Actions" >> config.prod.js
          echo "// ============================================================" >> config.prod.js
          echo "" >> config.prod.js
          echo "const CONFIG = {" >> config.prod.js
          echo "    SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> config.prod.js
          echo "    SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'," >> config.prod.js
          echo "    APP_NAME: 'NTWC_MPU_DRWS'," >> config.prod.js
          echo "    APP_VERSION: '2.0'," >> config.prod.js
          echo "    APP_ENV: 'production'," >> config.prod.js
          echo "    ENABLE_DEBUG: false" >> config.prod.js
          echo "};" >> config.prod.js
          echo "" >> config.prod.js
          echo "// Make it available globally" >> config.prod.js
          echo "if (typeof window !== 'undefined') {" >> config.prod.js
          echo "    window.__CONFIG__ = CONFIG;" >> config.prod.js
          echo "}" >> config.prod.js
          echo "" >> config.prod.js
          echo "// Export for Node.js" >> config.prod.js
          echo "if (typeof module !== 'undefined' && module.exports) {" >> config.prod.js
          echo "    module.exports = CONFIG;" >> config.prod.js
          echo "}" >> config.prod.js
          
          echo "📄 Production config created successfully"
          echo "✅ Config file content:"
          head -20 config.prod.js
      
      # Step 3: Verify the config file was created
      - name: Verify config file
        run: |
          if [ -f "config.prod.js" ]; then
            echo "✅ config.prod.js exists"
            echo "📄 File size: $(wc -c < config.prod.js) bytes"
          else
            echo "❌ config.prod.js was not created!"
            exit 1
          fi
      
      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy with secure configuration'
          force_orphan: true
      
      # Step 5: Show deployment URL
      - name: Show deployment URL
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Your site will be available at:"
          echo "   https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
